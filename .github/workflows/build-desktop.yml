name: Build Windows Desktop

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Exe
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run Tests
        run: go test -count=1 ./...

      - name: Build Windows Executable
        run: go build -ldflags "-H=windowsgui -s -w" -o mikrotik-automation.exe .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MikroTik-Automation-Windows
          path: mikrotik-automation.exe
