name: Build Android APK (Samsung Galaxy A56)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (ARM64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install Fyne CLI
        run: |
          go install fyne.io/tools/cmd/fyne@latest

      - name: Build Android APK (ARM64)
        run: |
          fyne package -os android/arm64 -app-id com.mikrotik.automation -name "MikroTik Auto" -icon icon.png

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MikroTik-Auto-Samsung-A56-APK
          path: "*.apk"
          if-no-files-found: warn
